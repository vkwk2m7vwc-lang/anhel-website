<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- Background -->
  <rect width="400" height="400" fill="#0A0A0A"/>

  <!-- Corner frames — same hairline detail as OG image, scaled to 400px canvas -->
  <path d="M 24 32 L 24 24 L 32 24" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <path d="M 368 24 L 376 24 L 376 32" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <path d="M 32 376 L 24 376 L 24 368" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <path d="M 376 368 L 376 376 L 368 376" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- ANHEL® wordmark — centered, smaller scale than OG -->
  <text x="200" y="225" text-anchor="middle"
        fill="#FFFFFF"
        font-family="Onest, 'Helvetica Neue', Arial, sans-serif"
        font-size="80"
        font-weight="500"
        letter-spacing="-3">ANHEL<tspan font-size="22" dy="-40" font-weight="400" opacity="0.6">®</tspan></text>
</svg>
